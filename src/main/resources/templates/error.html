<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — MONA MATTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@500;600;700&family=Kalam:wght@400;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <div class="sketchbook-canvas">
        <div class="sketchbook-sheet">
            <div class="sheet-inner text-center py-5">
                <div class="chapter-label mb-3">ERROR NOTE</div>
                <h1 class="t-hero mb-3">Something Went Off Page.</h1>
                <p class="t-handscript text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred.'}">An unexpected error occurred while processing your request.</p>
                <a href="/" class="btn-solid">RETURN TO SKETCHBOOK</a>
            </div>
        </div>
    </div>
</body>
</html>
