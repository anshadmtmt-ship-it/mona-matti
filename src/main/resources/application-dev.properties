# MONA MATTI — Development Spring Profile (application-dev.properties)
server.port=${SERVER_PORT:8099}

# Local H2 File Database
spring.datasource.url=jdbc:h2:file:./data/mona_matti;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

logging.level.com.monamatti=DEBUG
