# ==========================================================================
# MONA MATTI — Spring Boot Core Application Properties
# Production & DevOps Ready Configuration
# ==========================================================================

# Server Port Configuration (Supports SERVER_PORT environment variable)
server.port=${SERVER_PORT:8099}
spring.application.name=mona-matti

# Default Active Profile (Can be overridden by SPRING_PROFILES_ACTIVE=prod or dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Database Configuration Fallbacks
spring.datasource.url=jdbc:h2:file:./data/mona_matti;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console Configuration (Available in dev profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Performance & Database Optimization
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Graceful Shutdown & Kubernetes Readiness Probes
server.shutdown=graceful
management.endpoint.health.probes.enabled=true

# Thymeleaf Caching
spring.thymeleaf.cache=false

# Spring Boot Actuator Monitoring Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.root=INFO
logging.level.com.monamatti=INFO
logging.level.org.springframework.web=INFO
