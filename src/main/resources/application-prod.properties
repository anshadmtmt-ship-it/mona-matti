# MONA MATTI — Production Spring Profile (application-prod.properties)
# Hardened for Enterprise Deployment

server.port=${SERVER_PORT:8080}

# Database Connection via Environment Variables
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mona_matti}?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Security Hardening: Disable H2 Console & Sensitive Error Traces
spring.h2.console.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never

# Production JPA & Cache Performance
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=true

# Graceful Shutdown & Kubernetes Readiness Probes
server.shutdown=graceful
management.endpoint.health.probes.enabled=true

# Secure Actuator Exposure
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Production Logging
logging.level.root=WARN
logging.level.com.monamatti=INFO
logging.level.org.springframework.web=WARN
