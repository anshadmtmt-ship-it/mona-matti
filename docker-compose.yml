version: '3.8'

services:
  # ==========================================================================
  # MySQL 8.0 Relational Database Service
  # ==========================================================================
  mysql:
    image: mysql:8.0
    container_name: mona-matti-db
    restart: always
    environment:
      MYSQL_DATABASE: mona_matti
      MYSQL_USER: mona_user
      MYSQL_PASSWORD: mona_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mona-matti-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==========================================================================
  # MONA MATTI Spring Boot Web Application
  # ==========================================================================
  mona-matti-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mona-matti:latest
    container_name: mona-matti-app
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8099
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: mona_matti
      DB_USERNAME: mona_user
      DB_PASSWORD: mona_pass
    ports:
      - "8099:8099"
    networks:
      - mona-matti-net
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8099/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

# ==========================================================================
# Persistent Storage Volumes & Dedicated Bridge Network
# ==========================================================================
volumes:
  mysql_data:
    driver: local

networks:
  mona-matti-net:
    driver: bridge
